name: acrordrdc
title: Adobe Acrobat Reader (WINE)
summary: Adobe Acrobat Reader is a pdf reader & Web services developed by Adobe Inc.
description: |
  Adobe Acrobat Reader DC software is the free global standard for reliably viewing, printing, and commenting on PDF documents.

  And now, it's connected to the Adobe Document Cloud − making it easier than ever to work across computers and mobile devices.

  It's the only PDF viewer that can open and interact with all types of PDF content, including forms and multimedia.
adopt-info: acrordrdc

grade: stable
confinement: strict
base: core24
platforms:
  amd64:
compression: lzo
assumes:
  - snapd2.62

plugs:
  shmem:
    interface: shared-memory
    private: true
  wine-runtime-c24:
    interface: content
    target: $SNAP/wine-runtime
    default-provider: wine-platform-runtime-core24
  wine-base-staging:
    interface: content
    target: $SNAP/wine-platform
    default-provider: wine-platform

environment:
  WINEDLLOVERRIDES: "mscoree,mshtml="   # Prevent pop-ups about Wine Mono and Wine Gecko
  TRICKS: "win7 mspatcha riched20 vcrun2015 riched30 msftedit msls31"
  NO_AT_BRIDGE: "1"
  DISABLE_WAYLAND: "1" # Fix gtk decoration under wayland session
  SYSTEM_WGETRC: $SNAP/wine-runtime/etc/wgetrc
  RUN_EXE: "C:/Program Files (x86)/Adobe/Acrobat Reader DC/Reader/AcroRd32.exe"
  # https://www.adobe.com/devnet-docs/acrobatetk/tools/DesktopDeployment/cmdline.html#id6
  # https://www.adobe.com/devnet-docs/acrobatetk/tools/AdminGuide/properties.html#property-list
  # https://www.adobe.com/devnet-docs/acrobatetk/tools/DesktopDeployment/cmdline.html#id7
  # https://www.adobe.com/devnet-docs/acrobatetk/tools/AdminGuide/basicconfig.html#disabling-updates
  INSTALL_FLAGS: "/sall /rs /msi ENABLE_OPTIMIZATION=0 EULA_ACCEPT=YES DISABLE_ARM_SERVICE_INSTALL=1 DISABLEDESKTOPSHORTCUT=1 DISABLE_BROWSER_INTEGRATION=YES DISABLE_3D=YES UPDATE_MODE=0 DISABLE_PDF_INTEGRATION=YES DISABLE_ASIAN_FONTS=YES ENABLE_CHROMEEXT=0"

apps:
  acrordrdc:
    extensions: [gnome]
    command: bin/sommelier run-exe
    plugs:
      - cups-control
      - home
      - network
      - removable-media

  wine:
    extensions: [gnome]
    command: bin/sommelier
    plugs:
      - home
      - network
  winetricks:
    extensions: [gnome]
    command: bin/sommelier winetricks
    plugs:
      - network

parts:
  acrordrdc:
    plugin: nil
    source: ./snap/local/src
    override-build: |
      craftctl default
      set -ex
      craftctl set version="$(grep "^readonly VERSION" pre-install | cut -d'=' -f2)"
      mkdir -vp sommelier/hooks ; mv -v pre-install pre-start post-install sommelier/hooks ; cp -v -R -p sommelier "$SNAPCRAFT_PART_INSTALL"
    stage:
      - sommelier
    build-packages:
      - curl

  # The sommelier script helps you snap Windows applications using Wine. It
  # initializes and configures Wine and installs the Windows application.
  sommelier:
    plugin: make
    source: https://github.com/mmtrt/sommelier-core.git
    source-branch: "core24"
